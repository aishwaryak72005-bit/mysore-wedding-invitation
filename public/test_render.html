<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: url('/assets/palace-background.png') no-repeat center center;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .container {
      display: flex;
      gap: 50px;
      margin-top: 50px;
    }
    .box {
      position: relative;
      width: 320px;
      height: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label {
      color: #ffd700;
      font-family: serif;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px black;
    }
    .shadow {
      position: absolute;
      bottom: 10px;
      left: 15%;
      right: 15%;
      height: 25px;
      background: rgba(0,0,0,0.85);
      border-radius: 50%;
      filter: blur(12px);
      transform: scaleY(0.4);
      z-index: 1;
    }
    video, img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.75)) drop-shadow(0 0 15px rgba(212,175,55,0.2));
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="label">1. Transparent WebM (VP9 + Alpha)</div>
      <div class="shadow"></div>
      <video src="/assets/elephant-walking-transparent.webm" autoplay loop muted playsinline></video>
    </div>
    <div class="box">
      <div class="label">2. Transparent Animated WebP</div>
      <div class="shadow"></div>
      <img src="/assets/elephant-walking-transparent.webp" alt="Walking Elephant" />
    </div>
  </div>
</body>
</html>
